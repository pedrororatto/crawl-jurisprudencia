[project]
name = "juris"
version = "0.1.0"
description = "Coletor e API de jurisprudência de direito digital (TJSP no MVP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crawl4ai>=0.7.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "apscheduler>=3.10,<4",
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juris"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
