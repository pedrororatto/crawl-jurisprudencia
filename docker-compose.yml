services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: juris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juris}
      POSTGRES_DB: juris
    ports:
      # Só acessível via localhost/túnel SSH — nunca exponha 5432 em 0.0.0.0
      # numa VPS pública (Postgres é varrido e atacado por bots em horas).
      - "127.0.0.1:5432:5432"
    volumes:
      - juris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juris"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    command: uvicorn juris.api.main:app --host 0.0.0.0 --port 8000
    environment:
      JURIS_DATABASE_URL: postgresql+asyncpg://juris:${POSTGRES_PASSWORD:-juris}@db:5432/juris
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  crawler:
    profiles: ["app"]
    build: .
    command: python -m juris.scheduler
    environment:
      JURIS_DATABASE_URL: postgresql+asyncpg://juris:${POSTGRES_PASSWORD:-juris}@db:5432/juris
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Só para exercitar o caminho de upload do backup localmente. Sem isto, o
  # upload seria código que executa pela primeira vez em produção, de
  # madrugada, sem ninguém olhando.
  minio:
    profiles: ["backup-teste"]
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  juris_pgdata:
